    put:
      tags:
        - SCIM
      summary: Replace User
      description: |
        Replaces all of a user's attributes (full resource replacement).

        **Notes:**
        - This is a complete replacement operation - all mutable attributes must be provided
        - Immutable fields (id, userName, type, meta) are ignored if provided
        - Master admin user cannot be updated (system protection)

        **Required Fields:**
        - `schemas`: Must include User schema URI
        - `displayName`: User display name (cannot be empty)
        - `roles`: Exactly ONE role (array with single element)

        **Optional Fields:**
        - `password`: User password (not supported for SAML users - will return 400 error)
        - `description`: User description (use empty string to clear)
        - `urn:elementone:params:scim:schemas:extension:2.0:User`:
          - `type`: Authentication source (1=Local, 2=SAML, server will ignore this value)
          - `description`: User description (use empty string to clear)

        **Field Behavior:**
        - `userName`, `type`: Immutable - ignored if provided
        - `id`, `meta`: Read-only - ignored if provided
      operationId: replaceScimUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
          example: "23"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUserUpdate"
            examples:
              localUserBasic:
                summary: "Basic update for Local user"
                value:
                  schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:elementone:params:scim:schemas:extension:2.0:User"]
                  displayName: "John Smith"
                  roles: [{value: "roles/admin"}]
                  password: "NewPassw0rd!"
                  urn:elementone:params:scim:schemas:extension:2.0:User: {type: 1, description: "Engineering Team Lead"}
              samlUserMinimal:
                summary: "Minimal update for SAML user"
                value:
                  schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:elementone:params:scim:schemas:extension:2.0:User"]
                  displayName: "Jane Wilson"
                  roles: [{value: "roles/viewer"}]
                  urn:elementone:params:scim:schemas:extension:2.0:User: {type: 2, description: ""}
              withIgnoredFields:
                summary: "Request with ignored fields (demonstrates what gets ignored)"
                value:
                  schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:elementone:params:scim:schemas:extension:2.0:User"]
                  id: "123"
                  userName: "john.doe" # This immutable field will be ignored
                  displayName: "John Smith"
                  roles: [{value: "roles/admin"}]
                  password: "NewPassw0rd!"
                  urn:elementone:params:scim:schemas:extension:2.0:User: {type: 1, # This immutable field will be ignored
                    description: "team member"}
      responses:
        "204":
          description: User updated successfully (no content)
        "400":
          $ref: "#/components/responses/SCIMValidationErrorForUpdate"
        "401":
          description: Unauthenticated
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "401"
                detail: "Unable to pass authentication"
        "404":
          description: User not found
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "Request validation failed. User with ID 99 was not found."
        "415":
          $ref: "#/components/responses/SCIMUnsupportedMediaType"
        "500":
          description: Internal server error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              example:
                schemas:
                  - "urn:ietf:params:scim:api:messages:2.0:Error"
                status: "500"
                detail: "Server encounters an internal error. Try again later"
        "503":
          $ref: "#/components/responses/HTTPResponseServiceUnavailable"
