  /openapi/e1/v1/assets/query:
    post:
      tags:
        - ElementOne
      security:
        - BearerAuth: []
      summary: Get asset details.
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      requestBody:
        description: |
          Defines the filtering criteria used to query assets.
          All conditions specified in the request body are combined using a logical AND (intersection).
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_refs:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/AssetRef"
                  example:
                    - "1"
                    - "2"
                  description: |
                    Specifies the asset reference tokens generated by the server.
                    The tokens are used to filter asset information and may change over time. \
                    Each value must match exactly, and values are combined using a logical OR condition.
                names:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                  example:
                    - "MyHost"
                  description: |
                    Specifies the asset alias names used to filter assets. \
                    Each value must match exactly, and values are combined using a logical OR condition.
                hostnames:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                  example:
                    - "PC"
                  description: |
                    Specifies the asset hostnames used to filter assets. \
                    Each value must match exactly, and values are combined using a logical OR condition.
                dev_ids:
                  type: array
                  items:
                    type: string
                  uniqueItems: true
                  example:
                    - 2203-3839-BE0107001CDB1A2009
                    - 2203-3839-BE0107001CDB1A2100
                  description: |
                    Specifies the Portable Inspector device IDs used to filter assets. \
                    Each value must match exactly, and values are combined using a logical OR condition.
                created_time_start:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the start date and time (inclusive) for filtering an asset by its creation time.
                    The filter includes an operation that started at or after the specified value. \
                    The value must be in RFC 3339 format.
                created_time_end:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the end date and time (exclusive) for filtering an asset by its creation time.
                    The filter includes an operation that started before the specified value but excludes one that started exactly at the end time. \
                    The value must be in RFC 3339 format.
                last_collection_time_start:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the start date and time (inclusive) for filtering an asset by its collection time.
                    The filter includes an operation that started at or after the specified value. \
                    The value must be in RFC 3339 format.
                last_collection_time_end:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the end date and time (exclusive) for filtering an asset by its collection time.
                    The filter includes an operation that started before the specified value but excludes one that started exactly at the end time. \
                    The value must be in RFC 3339 format.
                last_assessment_time_start:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the start date and time (inclusive) for filtering an asset by its vulnerability assessment time.
                    The filter includes an operation that started at or after the specified value. \
                    The value must be in RFC 3339 format.
                last_assessment_time_end:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the end date and time (exclusive) for filtering an asset by its vulnerability assessment time.
                    The filter includes an operation that started before the specified value but excludes one that started exactly at the end time. \
                    The value must be in RFC 3339 format.
                sort:
                  description: |
                    Specifies how results are sorted.
                    - Fields: created_at, last_collection_time
                    - Order: asc (ascending), desc (descending)
                    - Default: ascending by created_at
                  type: array
                  items:
                    type: object
                    anyOf:
                      - type: object
                        required:
                          - created_at
                        properties:
                          created_at:
                            $ref: "#/components/schemas/SortOrder"
                        additionalProperties: false
                      - type: object
                        required:
                          - last_collection_time
                        properties:
                          last_collection_time:
                            $ref: "#/components/schemas/SortOrder"
                        additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonResponseSuccess"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ListAssetsResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseUnauthenticated"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseInternalError"
        "503":
          $ref: "#/components/responses/HTTPResponseServiceUnavailable"
