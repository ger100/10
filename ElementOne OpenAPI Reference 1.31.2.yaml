openapi: "3.0.0"
info:
  version: 1.0.0
  title: ElementOne OpenAPI
paths:
  /openapi/sp/v1/logs/malware-scan:
    post:
      tags:
        - Safe Port
      security:
        - BearerAuth: []
      summary: Get malware scan logs generated by Safe Port
      description: |
        Returns malware scan logs generated by Safe Port using the ElementOne API.
        Use this endpoint to query historical scan results with optional filtering criteria.
      operationId: getMalwareScanLogs
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      requestBody:
        description: Defines the filtering criteria used to query malware scan logs. All conditions specified in the request body are combined using a logical AND (intersection).
        required: true
        content:
          application/json:
            schema:
              description: All conditions are combined using intersection.
              type: object
              properties:
                session_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                    description: The session ID of the scan log
                  example:
                    - "4cd19f33-c759-4f31-b2a3-48237e093edc"
                    - "e6e08e23-44b2-4307-8366-23ed4d78739b"
                  description: |
                    Lists the session IDs of scan tasks, used to filter scan logs.
                    Each value must match exactly, and values are combined using a logical OR condition.
                visitors:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    description: The visitor name
                  description: "Lists the visitor names used to filter scan logs by guest identity. \nValues are combined using a logical OR condition, and partial matches are accepted in this field.\n"
                  example:
                    - "test user"
                    - "test user 2"
                scan_task_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                    description: The ID of the scan log
                  example:
                    - "4cd19f33-c759-4f31-b2a3-48237e093edc"
                    - "e6e08e23-44b2-4307-8366-23ed4d78739b"
                  description: "Lists the task IDs of scan tasks, used to filter malware scan logs. \nEach value must match exactly, and values are combined using a logical OR condition.\n"
                removable_media_serial_numbers:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    description: The serial number of the removable media
                  example:
                    - "09511666E0D55E6CE77CF761A9B614EF"
                    - "09511263E0D55E6CE87CF771A9B414EF"
                  description: "Lists the serial numbers of removable media used to filter the malware scan logs. \nEach value must match exactly, and values are combined using a logical OR condition.\n"
                scan_result:
                  $ref: "#/components/schemas/QnScanResultType"
                  description: Specifies the status of scan results used to filter logs. This field uses an enumerated (enum) type and accepts only exact matches.
                  example: 0
                scan_status:
                  $ref: "#/components/schemas/QnScanStatus"
                  description: Specifies the status of the scan. This field uses an enum type and accepts only exact matches.
                scan_time_start:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the start date and time (inclusive) for filtering a malware scan operation by its start time.
                    The filter includes an operation that started at or after the specified value.
                    The value must be in RFC 3339 format.
                scan_time_end:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the end date and time (exclusive) for filtering a malware scan operation by its start time.
                    The filter includes an operation that started before the specified value but excludes one that started exactly at the end time.
                    The value must be in RFC 3339 format.
      responses:
        "200":
          description: A list of malware scan logs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonResponseSuccess"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/GetMalwareScanLogResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseReqValidationFail"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseUnauthenticated"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseInternalError"
        "503":
          $ref: "#/components/responses/HTTPResponseServiceUnavailable"
  /openapi/sp/v1/logs/malware-scan/{logID}/confirm-items:
    get:
      tags:
        - Safe Port
      security:
        - BearerAuth: []
      summary: Get confirmation items for a malware scan log
      description: |
        Returns the current confirmation item working set (threats and unscannable items)
        for a malware scan log in the confirm-before-action workflow.
        This endpoint is read-only and does not change the workflow state.
      operationId: getMalwareScanConfirmItems
      parameters:
        - name: logID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Specifies the UUID of the malware scan log.
      responses:
        "200":
          description: Confirmation items for the malware scan log.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonResponseSuccess"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/MalwareScanConfirmItemsResponse"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseReqValidationFail"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseUnauthenticated"
        "404":
          description: Malware scan log not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseResourceNotFound"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseInternalError"
  /openapi/sp/v1/logs/malware-scan/confirm/approval:
    post:
      tags:
        - Safe Port
      security:
        - BearerAuth: []
      summary: Submit an approval decision for a malware scan confirmation workflow.
      description: |
        Submits an approval decision for a malware scan log that is waiting for
        approval. Accepts exactly one decision per confirmation request.
        Subsequent submissions are rejected with HTTP 409.
      operationId: approveMalwareScanConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMalwareScanConfirmRequest"
      responses:
        "200":
          description: Approval decision accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseSuccess"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseReqValidationFail"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseUnauthenticated"
        "404":
          description: Malware scan log not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseResourceNotFound"
        "409":
          description: "Conflict: Log is no longer actionable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseTaskConflict"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseInternalError"
  /openapi/sp/v1/logs/malware-scan/{logID}:
    get:
      tags:
        - Safe Port
      security:
        - BearerAuth: []
      summary: Get malware scan log details, including confirmation workflow state.
      description: |
        Returns full details for a single malware scan log, including
        confirmation workflow state fields when the log is in the
        confirm-before-action workflow.
      operationId: getMalwareScanLogDetail
      parameters:
        - name: logID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Specifies the UUID of the malware scan log.
      responses:
        "200":
          description: Malware scan log details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JsonResponseSuccess"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/MalwareScanLogDetailResponse"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseReqValidationFail"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseUnauthenticated"
        "404":
          description: Malware scan log not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseResourceNotFound"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonResponseInternalError"
  /openapi/sp/v1/logs/media-check:
