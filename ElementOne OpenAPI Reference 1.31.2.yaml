              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "Request validation failed. User with ID 99 was not found."
        "415":
          $ref: "#/components/responses/SCIMUnsupportedMediaType"
        "500":
          description: Internal server error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              example:
                schemas:
                  - "urn:ietf:params:scim:api:messages:2.0:Error"
                status: "500"
                detail: "Server encounters an internal error. Try again later"
        "503":
          $ref: "#/components/responses/HTTPResponseServiceUnavailable"
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: api-key
  parameters:
    PageToken:
      name: page_token
      in: query
      description: "Enables pagination by using a page_token from the previous response. \nInclude this token in the next request to retrieve the next page of results. \nIf no token is returned, no more data is available.\n"
      required: false
      schema:
        $ref: "#/components/schemas/PageToken"
    PageSize:
      name: page_size
      in: query
      description: Specifies the number of records returned per page. If not provided, the default is 50. The value must be between 1 and 1000.
      required: false
      schema:
        type: integer
        maximum: 1000
        default: 50
        example: 50
        minimum: 1
    MetricType:
      name: type
      in: query
      description: |
        Specifies the metric type to retrieve. Possible values include: \
          `cpu`: CPU usage \
          `memory`: Memory usage \
          `fs`: File system (disk) usage
      required: false
      schema:
        type: string
        enum:
          - cpu
          - memory
          - fs
      example: cpu
  responses:
    HTTPResponseServiceUnavailable:
      description: "Service unavailable due to rate limit"
      content:
        text/html:
          schema:
            type: string
            example: |
              <html>
              <head><title>503 Service Temporarily Unavailable</title></head>
              <body>
              <center><h1>503 Service Temporarily Unavailable</h1></center>
              <hr><center>nginx</center>
              </body>
              </html>
    SCIMUnsupportedMediaType:
      description: |
        Unsupported Media Type for SCIM requests.

        **SCIM Protocol Requirement**: All SCIM requests must use `application/scim+json` Content-Type as specified in RFC 7644 Section 3.1.

        **Common Causes**:
        - Using `application/json` instead of `application/scim+json`
        - Missing Content-Type header
        - Invalid or unsupported Content-Type

        **Resolution**: Set request header `Content-Type: application/scim+json`
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            standard415Error:
              summary: "Standard SCIM 415 Error"
              value:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "415"
                detail: "Request validation failed. Content-Type must be `application/scim+json` for SCIM requests."
    SCIMValidationErrorForCreate:
      description: "Request validation failed - Common scenarios:\n- Missing required fields\n- Invalid field types or formats \n- Field value constraints violated (length, pattern, enum values)\n- Invalid SCIM schema URNs\n- ElementOne-specific business rule violations\n"
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            genericValidationForSchemas:
              summary: "Generic validation failure for schemas field"
              value:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "400"
                detail: "Request validation failed. The `schemas` field in your request is invalid or missing."
            genericValidationForRoles:
              summary: "Generic validation failure for roles field"
              value:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "400"
                detail: "Request validation failed. The `roles` field in your request is invalid or missing."
            # Business Logic Violations
            passwordForSamlUser:
              summary: "Password field not supported for SAML users"
              value:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "400"
                detail: "Request validation failed. The `password` field is not allowed for SAML users (type = 2)."
            # Generic validation message
            genericValidation:
              summary: "Generic validation failure"
              value:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "400"
                detail: "Request validation failed. Please check your request format and required fields."
    SCIMValidationErrorForUpdate:
      description: "Request validation failed - Common scenarios:\n- Missing required fields\n- Invalid field types or formats \n- Field value constraints violated (length, pattern, enum values)\n- Invalid SCIM schema URNs\n- ElementOne-specific business rule violations\n"
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
          examples:
            genericValidationForSchemas:
              summary: "Generic validation failure for schemas field"
              value:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
