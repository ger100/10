  /openapi/e1/v1/scim/Users:
    get:
      tags:
        - SCIM
      summary: List Users
      description: "Queries SCIM users with filter expressions to search by specific attributes.\n\n**Supported Attributes:**\n- `id` (String): User ID\n- `userName` (String): User login name  \n- `displayName` (String): User display name\n- `type` (Integer): User type (1=Local, 2=SAML)\n- `roles` (String): User role (for arrays, checks if array contains value)\n- `description` (String): User description\n\n**Supported Operators:**\n- `eq` (equal): Exact match\n- `co` (contains): String contains substring\n"
      operationId: listScimUsers
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          description: SCIM filter expression
          schema:
            type: string
          examples:
            basicEquality:
              summary: Basic equality filter
              value: 'userName eq "john.doe"'
            stringContains:
              summary: String contains filter
              value: 'displayName co "John"'
            arrayContains:
              summary: Array contains filter (roles)
              value: 'roles eq "roles/admin"'
            typeFilter:
              summary: User type filter
              value: "type eq 1"
        - name: startIndex
          in: query
          required: false
          description: |
            1-based pagination start index (SCIM standard).
            Must be greater than or equal to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: count
          in: query
          required: false
          description: |
            Number of results to return per page.
            Maximum allowed: 200 results per request.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: sortBy
          in: query
          required: false
          description: "Attribute name for sorting results. \nOnly single-field sorting is supported.\n\n**Supported Fields:**\n- `userName`: Sort by user login name (string, case-insensitive)\n- `displayName`: Sort by display name (string, case-insensitive)  \n- `id`: Sort by user ID (string, numeric order)\n- `type`: Sort by user type (integer: 1=Local, 2=SAML)\n"
          schema:
            type: string
            enum:
              - userName
              - displayName
              - id
              - type
          examples:
            userName:
              summary: Sort by userName
              value: userName
            displayName:
              summary: Sort by displayName
              value: displayName
            id:
              summary: Sort by id
              value: id
            type:
              summary: Sort by type
              value: type
        - name: sortOrder
          in: query
          required: false
          description: |
            Sort direction. Only applicable when `sortBy` is specified.
            Defaults to `ascending` if not provided.
          schema:
            type: string
            enum:
              - ascending
              - descending
            default: ascending
          examples:
            ascending:
              summary: Ascending order
              value: ascending
            descending:
              summary: Descending order
              value: descending
      responses:
        "200":
          description: List of users
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUserListResponse"
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
                totalResults: 2
                startIndex: 1
                itemsPerPage: 2
                Resources:
                  - schemas:
                      - "urn:ietf:params:scim:schemas:core:2.0:User"
                      - "urn:elementone:params:scim:schemas:extension:2.0:User"
                    id: "1"
                    userName: "john.doe"
                    displayName: "John Doe"
                    roles: [{value: "roles/admin"}]
                    urn:elementone:params:scim:schemas:extension:2.0:User: {type: 1, description: "Admin user"}
                    meta:
                      resourceType: "User"
                      created: "2023-01-15T10:30:00Z"
                      lastModified: "2023-01-15T14:20:00Z"
                      location: "https://elementone/openapi/e1/v1/scim/Users/1"
                      # Note: elementone will be replaced with your configured FQDN
                  - schemas:
                      - "urn:ietf:params:scim:schemas:core:2.0:User"
                      - "urn:elementone:params:scim:schemas:extension:2.0:User"
                    id: "2"
                    userName: "jane.smith@example.com"
                    displayName: "Jane Smith"
                    roles: [{value: "roles/viewer"}]
                    urn:elementone:params:scim:schemas:extension:2.0:User: {type: 2, description: "SAML user"}
                    meta:
                      resourceType: "User"
                      created: "2023-01-16T09:15:00Z"
                      lastModified: "2023-01-16T09:15:00Z"
                      location: "https://elementone/openapi/e1/v1/scim/Users/2"
                      # Note: elementone will be replaced with your configured FQDN
        "400":
          description: Bad request (invalid filter or parameters)
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              examples:
                invalidFilter:
                  summary: Invalid filter expression
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    detail: "Request validation failed. The filter expression is invalid. Verify the syntax and supported attributes."
                invalidParameters:
                  summary: Invalid parameters
