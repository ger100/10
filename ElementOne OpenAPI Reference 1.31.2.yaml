    delete:
      tags:
        - SCIM
      summary: Delete User
      description: |
        Deletes a user from the system permanently.

        **Notes:**
        - This is a permanent deletion operation
        - Master admin user cannot be deleted (system protection)
        - After deletion, the user ID cannot be reused
        - All user sessions will be terminated

        **Behavior:**
        - Returns 204 No Content on successful deletion
        - Returns 404 if user already doesn't exist (idempotent)
      operationId: deleteScimUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier
          schema:
            type: string
      responses:
        "204":
          description: User deleted successfully
        "400":
          description: Bad request (cannot delete master admin)
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              examples:
                cannotDeleteAdmin:
                  summary: "Cannot delete master admin"
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    detail: "Request validation failed. The master admin user cannot be deleted."
