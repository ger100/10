    QnStorageMediaType:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Specifies the type of storage media:
          0: Unspecified
          1: Disk
          2: CD-ROM
    QnMediaStatus:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
      description: |
        Specifies the status of the media:
          0: Unspecified
          1: All partitions scanned
          2: Unsupported partition found
          3: Unpartitioned
          4: Unsupported
    QnDiskStorageInfo:
      type: object
      description: The disk storage information schema
      required:
        - storage_media_type
        - size
        - storage_space_infos
      properties:
        storage_media_type:
          $ref: "#/components/schemas/QnStorageMediaType"
          description: |
            Shows the type of media associated with the individual storage partition:
              0: Unspecified
              1: Disk
              2: CD-ROM
        size:
          type: integer
          example: 1234567890
          description: Shows the size of the storage partition in bytes.
          format: uint64
        storage_space_infos:
          type: array
          description: Shows detailed information about the storage space within the partition.
          items:
            $ref: "#/components/schemas/QnDiskSpaceInfo"
    QnStorageSpaceType:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
      description: |
        The type of the storage space:
          - 0: Unspecified
          - 1: Supported
          - 2: Unsupported
          - 3: Unallocated
    QnDiskSpaceInfo:
      type: object
      description: The disk space information schema
      required:
        - storage_space_type
        - size
        - start_address
      properties:
        storage_space_type:
          $ref: "#/components/schemas/QnStorageSpaceType"
          description: |
            Shows the type of the storage space:
              0: Unspecified
              1: Supported
              2: Unsupported
              3: Unallocated
        size:
          type: integer
          example: 1234567890
          description: Shows the size of the specific storage space within the partition in bytes.
          format: uint64
        start_address:
          type: integer
          example: 987654321
          description: Shows the start address of the storage space within the partition in bytes.
          format: uint64
        drive_letter:
          type: string
          example: "C"
          description: Shows the drive letter assigned to the storage space. This field is included only when the storage space is supported.
        volume_name:
          type: string
          example: "WINPE"
          description: Shows the name of the volume assigned to the storage space. This field is included only when the storage space is supported.
        file_system:
          type: string
          example: "NTFS"
          description: Shows the file system of the storage space. This field is included only when the storage space is supported.
    QnDiagUSBDeviceInfo:
      type: object
      properties:
        dev_id:
          $ref: "#/components/schemas/SafePortID"
        usb_devices:
          type: array
          description: Shows the list of USB devices connected to the Safe Port devices.
          items:
            $ref: "#/components/schemas/QnDiagUSBDeviceProperties"
    QnDiagUSBDeviceProperties:
      type: object
      properties:
        device_instance_id:
          type: string
          description: Shows the instance ID of the USB device.
          example: "USB\\VID_0781&PID_55AB\\MSFT3000014216100524214625"
        name:
          type: string
          description: Shows the name of the USB device.
          example: "USB Attached SCSI (UAS) Mass Storage Device"
        bus_reported_device_desc:
          type: string
          description: "Shows the device description reported by the USB bus, typically including vendor, product, and version information. \nThis value helps identify how the device is recognized by the system.\n"
          example: "SanDisk 3.2Gen1"
    MediaCheckLog:
      type: object
      description: Shows the schema definition for the media check log.
      required:
        - session_id
        - media_check_id
        - visitor
        - visitor_mode
        - start_time
        - received_time
        - media_status
        - storage_media_type
        - removable_media_sn
        - removable_media_name
        - dev_id
        - dev_name
        - storage_media_infos
        - unallocated_space_size
      properties:
        session_id:
          type: string
          format: uuid
          example: 4cd19f33-c759-4f31-b2a3-48237e093edc
        media_check_id:
          type: string
          format: uuid
          example: "e6e08e23-44b2-4307-8366-23ed4d78739b"
          description: Shows the task ID of the media check.
        visitor_mode:
          $ref: "#/components/schemas/QnOperatorMode"
          description: |
            Shows the visitor's mode.
              0: Anonymous mode
              1: Guest mode
              2: Employee mode
        visitor:
          type: string
          example: "guest"
          description: |
            Shows the name of the visitor associated with the media check.
            This field is empty if the visitor was in Anonymous mode.
        start_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50+08:00"
          description: Shows the start time of the media check.
        received_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50+08:00"
          description: Shows the time the media check result was received.
        media_status:
          $ref: "#/components/schemas/QnMediaStatus"
          description: |
            Shows the status of the media.
              0: Unspecified
              1: All partitions scanned
              2: Unsupported partition found
              3: Unpartitioned
              4: Unsupported
        storage_media_type:
          $ref: "#/components/schemas/QnStorageMediaType"
          description: |
            Shows the type of storage media checked.
              0: Unspecified
              1: Disk
              2: CD-ROM
        removable_media_sn:
          type: string
          example: "09511666E0D55E6CE77CF761A9B614EF"
          description: Shows the serial number of the removable media involved in the media check.
        removable_media_name:
          type: string
          example: "Kingston DataTraveler 3.0 USB Device"
          description: Shows the name of the removable media involved in the media check.
        dev_id:
          type: string
          example: "ES101-00000000-0000-0000-0000-000000000000"
          description: Shows the device ID of the Safe Port associated with the media check.
        dev_name:
          type: string
          example: "Safe Port"
          description: Shows the name of the Safe Port associated with the media check.
        storage_media_infos:
          type: array
          description: |
            Shows detailed storage usage information for each partition on the checked media.
            This field is included only when a media check has been performed.
          items:
            $ref: "#/components/schemas/QnDiskStorageInfo"
        unallocated_space_size:
          type: integer
          description: |
            Shows the size of unallocated space on the media in bytes.
            This field is included only when a media check has been performed.
          example: 123456789
          format: uint64
    GetMediaCheckLogResponse:
      description: "Get media check log response data schema"
      type: object
      required:
        - logs
        - next_page_token
      properties:
        logs:
          type: array
          description: The media check logs
          items:
            $ref: "#/components/schemas/MediaCheckLog"
        next_page_token:
          $ref: "#/components/schemas/PageToken"
    QnWipeResult:
      type: integer
      enum:
        - 0
        - 1
      format: uint8
      description: |
        Specifies the result of the wipe:
          0: Successful
          1: Failed
    WipeLog:
      type: object
      description: Shows the schema definition for the wipe log.
      required:
        - session_id
        - wipe_id
        - visitor_mode
        - visitor
        - start_time
        - end_time
        - received_time
        - wipe_result
        - removable_media_sn
        - dev_id
        - dev_name
      properties:
        session_id:
          type: string
          format: uuid
          example: 4cd19f33-c759-4f31-b2a3-48237e093edc
        wipe_id:
          type: string
          format: uuid
          example: "e6e08e23-44b2-4307-8366-23ed4d78739b"
          description: Shows the task ID of the wipe.
        visitor_mode:
          $ref: "#/components/schemas/QnOperatorMode"
          description: Shows the visitor's mode.
        visitor:
          type: string
          example: "guest"
          description: |
            Shows the name of the visitor associated with the wipe.
            This field is empty if the visitor was in Anonymous mode.
        start_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50+08:00"
          description: Shows the start time of the wipe.
        end_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50+08:00"
          description: Shows the end time of the wipe.
        received_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50+08:00"
          description: Shows the time the wipe result was received.
        wipe_result:
          $ref: "#/components/schemas/QnWipeResult"
          description: Shows the result of the wipe.
        removable_media_sn:
          type: string
          example: "09511666E0D55E6CE77CF761A9B614EF"
          description: Shows the serial number of the removable media involved in the wipe.
        dev_id:
          type: string
          example: "ES101-00000000-0000-0000-0000-000000000000"
          description: Shows the device ID of the Safe Port associated with the wipe.
        dev_name:
          type: string
          example: "Safe Port"
          description: Shows the name of the Safe Port associated with the wipe.
    GetWipeLogResponse:
      description: "Get wipe log response data schema"
      type: object
      required:
        - logs
        - next_page_token
      properties:
        logs:
          type: array
          description: The wipe logs
          items:
            $ref: "#/components/schemas/WipeLog"
        next_page_token:
          $ref: "#/components/schemas/PageToken"
    PackageInfo:
      type: object
      required:
        - name
        - version
        - release_date
      properties:
        name:
          type: string
          description: "Shows the name of the firmware or pattern in each entry. \nPossible values include ElementOne, Safe Port, Portable Inspector, Vulnerability Detection Service Pattern, and Anti-Virus Pattern.\n"
          enum:
            - Vulnerability Detection Service Pattern
            - Anti-Virus Pattern
            - ElementOne
            - Safe Port
            - Portable Inspector
        version:
          type: string
          description: |
            Shows the current version for firmware of ElementOne, Safe Port, Portable Inspector, and for Vulnerability Detection Service and Anti-Virus patterns.
          example: "1.0.0"
        last_update_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: |
            Shows the last successful update time for firmware of ElementOne, Safe Port, and Portable Inspector, and for Vulnerability Detection Service and Anti-Virus patterns.
            This field is not shown if no successful update exists.
        release_date:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: |
            Shows the release date for firmware of ElementOne, Safe Port, and Portable Inspector, and for Vulnerability Detection Service and Anti-Virus patterns.
    GetPatternsResponse:
      description: |
        Lists the current pattern information for the Vulnerability Detection Service and Anti-Virus patterns.
      type: array
      items:
        $ref: "#/components/schemas/PackageInfo"
    GetFirmwaresResponse:
      description: |
        Lists the current firmware information for ElementOne, Safe Port, and Portable Inspector.
      type: array
      items:
        $ref: "#/components/schemas/PackageInfo"
    ListQyawanDevicesRequest:
      type: object
      description: Defines the filtering criteria used to query Qyawan devices.
      properties:
        hostnames:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Lists the hostnames assigned to the devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - host1
            - host2
        macs:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Lists the MAC addresses assigned to the devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - 00:1A:2B:3C:4D:5E
            - 00:1A:2B:3C:4D:5F
        ips:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Lists the IP addresses assigned to the devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - 192.168.1.1
            - 192.168.1.2
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Lists the unique IDs assigned to the devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - ES101-00000000-0000-0000-0000-000000000000
            - ES101-00000000-0000-0000-0000-000000000001
        names:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Lists the names assigned to the devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - Qyawan Device 1
            - Qyawan Device 2
    ListQyawanDevicesResponse:
      type: object
      required:
        - id
        - hostname
        - ip
        - mac
        - name
      properties:
        id:
          type: string
          description: Shows the unique ID assigned to the device.
          example: ES101-5688b457-b4ce-4278-95d4-49f07890609d
        hostname:
          type: string
          description: Shows the hostname assigned to the Safe Port.
          example: safeport.local
        ip:
          type: string
          example: 192.168.1.5
        mac:
          type: string
          format: mac
          description: Shows the name assigned to the Safe Port.
          example: 00:1A:2B:3C:4D:5E
        name:
          type: string
          description: The Qyawan's name
          example: Safe Port
    ListQyawanDevicePoliciesRequest:
      type: object
      description: Defines the filtering criteria used to query Safe Port device policies.
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Specifies the unique IDs assigned to the devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - ES101-00000000-0000-0000-0000-000000000000
            - ES101-00000000-0000-0000-0000-000000000001
    ListQyawanDevicePoliciesResponse:
      type: object
      description: Shows the Safe Port device policy information.
      required:
        - id
        - updated_at
        - policy
        - use_inherit_cfg
      properties:
        id:
          type: string
          example: ES101-5688b457-b4ce-4278-95d4-49f07890609d
        updated_at:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: |
            Shows the time the record was last updated, in RFC 3339 date-time format.
        policy:
          $ref: "#/components/schemas/QnPolicy"
        use_inherit_cfg:
          type: boolean
          description: Whether the group setting is inherited from the parent group or not
    ListQyawanDeviceStatusesRequest:
      type: object
      description: Defines the filter criteria used to query Safe Port device statuses.
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Lists the unique IDs of Safe Port devices.
            Each value must match exactly, and values are combined using a logical OR condition.
          example:
            - ES101-00000000-0000-0000-0000-000000000000
            - ES101-00000000-0000-0000-0000-000000000001
    ListQyawanDeviceStatusesResponse:
      type: object
      description: Shows the Safe Port device status information.
      required:
        - device_info
        - policy
        - commands
      properties:
        device_info:
          $ref: "#/components/schemas/DeviceInfo"
        policy:
          $ref: "#/components/schemas/Policy"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/DeviceCommand"
    ListQyawanDiagInfoUSBDeviceRequest:
      type: object
      description: Defines the filter criteria used to query diagnostic information about USB devices connected to Safe Port devices.
      properties:
        dev_ids:
          type: array
          items:
            $ref: "#/components/schemas/SafePortID"
          uniqueItems: true
          minItems: 1
          maxItems: 10
          description: |
            Lists the unique IDs of Safe Port devices.
            Each value must match exactly, and values are combined using a logical OR condition.
            You can specify up to 10 device IDs.
          example:
            - ES101-00000000-0000-0000-0000-000000000000
            - ES101-00000000-0000-0000-0000-000000000001
      required:
        - dev_ids
    ListQyawanDiagInfoUSBDeviceResponse:
      type: object
      description: |
        Shows diagnostic information for USB devices connected to Safe Port devices.
        The response includes lists of device IDs categorized as online, timeout, offline, unsupported, invalid, or internal error.
        Each list contains the corresponding device IDs or device information objects.
      properties:
        online_devices:
          type: array
          items:
            $ref: "#/components/schemas/QnDiagUSBDeviceInfo"
        timeout_dev_ids:
          type: array
          description: Shows the device IDs of Safe Port devices that failed to respond within 15 seconds.
          items:
            $ref: "#/components/schemas/SafePortID"
        offline_dev_ids:
          type: array
          description: Shows the device IDs of Safe Port devices that are offline.
          items:
            $ref: "#/components/schemas/SafePortID"
        unsupported_dev_ids:
          type: array
          description: Shows the device IDs of Safe Port devices that cannot collect USB device diagnostic information.
          items:
            $ref: "#/components/schemas/SafePortID"
        invalid_dev_ids:
          type: array
          description: Shows the invalid Safe Port device IDs.
          items:
            $ref: "#/components/schemas/SafePortID"
        internal_error_dev_ids:
          type: array
          description: Shows the device IDs of Safe Port devices that encountered an internal error.
          items:
            $ref: "#/components/schemas/SafePortID"
    UpgradeQyawanDevicesRequest:
      type: object
      description: Specifies the request body used to upgrade Safe Port devices.
      properties:
        dev_ids:
          type: array
          items:
            $ref: "#/components/schemas/SafePortID"
          uniqueItems: true
    UpgradeQyawanDevicesResponse:
      type: object
      description: Shows the response returned after upgrading Safe Port devices.
      required:
        - triggered_count
      properties:
        triggered_count:
          type: integer
          description: Shows the number of devices that were successfully notified for the upgrade.
          example: 4
        unsupported_dev_ids:
          type: array
          items:
            $ref: "#/components/schemas/SafePortID"
        failed_dev_ids:
          type: array
          items:
            $ref: "#/components/schemas/SafePortID"
    GetFormatLogResponse:
      type: object
      required:
        - items
        - next_page_token
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FormatLog"
        next_page_token:
          $ref: "#/components/schemas/PageToken"
    NetworkConfig:
      type: object
      description: Shows the network configuration of Safe Port devices.
      properties:
        type:
          type: integer
          enum:
            - 1
            - 2
          description: |
            Shows the network type:
              - 1: ETHERNET
              - 2: WiFi
          example: 1
        ip_addr:
          type: array
          items:
            type: object
            properties:
              ip:
                type: string
                example: 192.168.1.5
              netmask:
                type: string
                example: 255.255.255.0
        gateway:
          type: array
          items:
            type: string
            example: 192.168.1.254
        dns:
          type: array
          items:
            type: string
            example: 8.8.8.8
        mac:
          type: array
          items:
            type: string
            format: mac
            example: 12:34:56:78:9A:02
        is_dhcp:
          type: boolean
          description: Shows whether DHCP is enabled.
    QnFileDetention:
      type: object
      required:
        - enabled
        - threats
        - unscannable_items
      example:
        enabled: true
        threats: 1
        unscannable_items: 1
      properties:
        enabled:
          type: boolean
          description: Indicates whether file detention is enabled.
        threats:
          type: integer
          minimum: 0
          maximum: 127
          enum:
            - 0
            - 1
          description: |
            Indicates the action applied to detected threats:
              - 0: No action
              - 1: Upload
        unscannable_items:
          type: integer
          minimum: 0
          maximum: 127
          enum:
            - 0
            - 1
          description: |
            Indicates the action applied to unscannable items:
              - 0: No action
              - 1: Upload
    QnDiskReset:
      type: object
      required:
        - format
        - erase
        - wipe
      properties:
        format:
          type: object
          required:
            - enabled
          example:
            enabled: true
          properties:
            enabled:
              type: boolean
              description: Shows whether disk format is enabled.
        erase:
          type: object
          required:
            - enabled
          example:
            enabled: true
          properties:
            enabled:
              type: boolean
              description: Shows whether disk erase is enabled.
        wipe:
          type: object
          required:
            - enabled
          example:
            enabled: false
          properties:
            enabled:
              type: boolean
              description: Shows whether disk wipe is enabled.
    QnSecureFileTransfer:
      type: object
      required:
        - general_device_to_bunban_pro
      properties:
        general_device_to_bunban_pro:
          type: object
          required:
            - enabled
          example:
            enabled: true
          properties:
            enabled:
              type: boolean
              description: Shows whether Secure File Transfer is enabled, allowing files to be transferred from removable media to Portable Inspector Pro.
    QnScanRestrictionPatternOutdateUnit:
      type: integer
      enum:
        - 2
        - 3
        - 4
      description: |
        Shows the time unit for the pattern-outdate grace period, which determines how long scanning remains active after the pattern was last updated.
          - 2: Hour
          - 3: Day
          - 4: Week
    QnScanRestrictionDisconnectedUnit:
      type: integer
      enum:
        - 1
        - 2
        - 3
      description: |
        Shows the time unit for the disconnection grace period, which determines how long scanning remains active after Safe Port becomes disconnected.
          - 1: Minute
          - 2: Hour
          - 3: Day
    QnScanRestrictionPatternOutdate:
      type: object
      required:
        - enabled
        - value
        - unit
      example:
        enabled: true
        value: 1
        unit: 2
      properties:
        enabled:
          type: boolean
          description: Shows whether the pattern-outdate restriction is enabled.
        value:
          type: integer
          minimum: 1
          maximum: 2147483640
          description: Shows the grace-period value for the pattern-outdate restriction. This period defines how long scanning remains active after the pattern was last updated.
          example: 1
        unit:
          $ref: "#/components/schemas/QnScanRestrictionPatternOutdateUnit"
    QnScanRestrictionDisconnected:
      type: object
      required:
        - enabled
        - value
        - unit
      example:
        enabled: false
        value: 15
        unit: 1
      properties:
        enabled:
          type: boolean
          description: Shows whether the disconnection restriction is enabled.
        value:
          type: integer
          minimum: 1
          maximum: 2147483640
          description: Shows the grace-period value for the disconnection restriction. This period defines how long scanning remains active after Safe Port becomes disconnected.
          example: 15
        unit:
          $ref: "#/components/schemas/QnScanRestrictionDisconnectedUnit"
    QnScanRestriction:
      type: object
      required:
        - pattern_outdate
        - disconnected
      example:
        pattern_outdate:
          enabled: true
          value: 1
          unit: 2
        disconnected:
          enabled: false
          value: 15
          unit: 1
      properties:
        pattern_outdate:
          $ref: "#/components/schemas/QnScanRestrictionPatternOutdate"
        disconnected:
          $ref: "#/components/schemas/QnScanRestrictionDisconnected"
    QnOsPatching:
      type: object
      required:
        - auto_update
      properties:
        auto_update:
          type: boolean
          default: true
          description: Indicates whether OS patches are automatically updated.
          example: true
    QnProxy:
      type: object
      required:
        - mode
      properties:
        mode:
          type: integer
          minimum: 0
          maximum: 127
          default: 0
          description: |
            Shows whether the Safe Port device uses a proxy.
              - 0: Disabled
              - 1: Use ElementOne as a proxy
          example: 0
    QnPolicy:
      type: object
      required:
        - scan_action
        - visitor_mode
        - auto_start
        - usb_tagging
        - allowlist
        - file_detention
        - disk_reset
        - secure_file_transfer
        - scan_restriction
        - os_patching
        - proxy
      properties:
        scan_action:
          $ref: "#/components/schemas/QnScanAction"
        visitor_mode:
          $ref: "#/components/schemas/QnOperatorMode"
        auto_start:
          $ref: "#/components/schemas/QnAutoStart"
        usb_tagging:
          $ref: "#/components/schemas/QnUSBTagging"
        allowlist:
          type: array
          items:
            $ref: "#/components/schemas/AllowlistItem"
        file_detention:
          $ref: "#/components/schemas/QnFileDetention"
        disk_reset:
          $ref: "#/components/schemas/QnDiskReset"
        secure_file_transfer:
          $ref: "#/components/schemas/QnSecureFileTransfer"
        scan_restriction:
          $ref: "#/components/schemas/QnScanRestriction"
        os_patching:
          $ref: "#/components/schemas/QnOsPatching"
        proxy:
          $ref: "#/components/schemas/QnProxy"
    AppliedPolicy:
      type: object
      required:
        - scan_action
        - visitor_mode
        - auto_start
        - usb_tagging
        - allowlist
        - file_detention
        - scan_restriction
        - unlock
      properties:
        scan_action:
          $ref: "#/components/schemas/QnScanAction"
        visitor_mode:
          $ref: "#/components/schemas/QnOperatorMode"
        auto_start:
          $ref: "#/components/schemas/QnAutoStart"
        usb_tagging:
          $ref: "#/components/schemas/QnUSBTagging"
        allowlist:
          type: array
          items:
            $ref: "#/components/schemas/BaseAllowlistItem"
        file_detention:
          $ref: "#/components/schemas/QnFileDetention"
        disk_reset:
          $ref: "#/components/schemas/QnDiskReset"
        secure_file_transfer:
          $ref: "#/components/schemas/QnSecureFileTransfer"
        scan_restriction:
          $ref: "#/components/schemas/QnScanRestriction"
        os_patching:
          $ref: "#/components/schemas/QnOsPatching"
        proxy:
          $ref: "#/components/schemas/QnProxy"
        unlock:
          type: boolean
          description: Shows whether Items Unlock Mode is enabled for Safe Port, allowing users to unlock files previously locked during scanning.
    BaseAllowlistItem:
      type: object
      required:
        - id
        - last_modified_time
      properties:
        id:
          type: string
          format: uuid
          example: 4cd19f33-c759-4f31-b2a3-48237e093edc
        file_ext:
          type: string
          minLength: 1
          maxLength: 260
          pattern: ^[^.\\\/:*?<>"|]+$
          description: Shows the file extension. This field is not shown if the filename is specified.
          example: txt
        file_hash:
          $ref: "#/components/schemas/Sha256"
          description: Shows the file hash.
        filename:
          type: string
          minLength: 1
          maxLength: 260
          pattern: ^[^\\\/:*?<>"|]+$
          description: Shows the filename. This field cannot be provided if file_ext is provided.
          example: example.txt
        is_subfolder_included:
          type: boolean
          description: Indicates whether subfolders are included.
          example: true
        specified_folder:
          type: string
          minLength: 1
          maxLength: 260
          pattern: ^[^:*?<>"|]+$
          description: Returns the folder path with all backslashes (\) replaced with forward slashes (/).
          example: /temp
        unscanned_reason:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: |
            Indicates why the items was not scanned. Possible values:
              - 1: Permission forbids
              - 2: Compression layer overlimit
              - 3: Password-protected
          example: 1
    AllowlistItem:
      allOf:
        - $ref: "#/components/schemas/BaseAllowlistItem"
        - type: object
          properties:
            comment:
              type: string
              description: The comment
              example: This file is not scanned
            last_modified_time:
              type: string
              format: date-time
              example: "2022-08-25T10:20:50Z"
              description: |
                The last time the allowlist item was modified
    DeviceInfo:
      type: object
      description: Shows the device information.
      required:
        - name
        - hostname
        - id
        - is_online
        - last_disconnected_time
        - firmware_version
        - upgrade_status
        - last_firmware_update_time
        - anti_virus_pattern_version
        - last_pattern_update_time
        - timezone
      properties:
        name:
          type: string
          description: Shows the device name.
          example: Safe Port
        hostname:
          type: string
          description: Shows the hostname of the device.
          example: safeport.local
        id:
          type: string
          description: Shows the unique ID of the device.
          example: ES101-5688b457-b4ce-4278-95d4-49f07890609d
        is_online:
          type: boolean
          example: true
          description: Shows whether the device is online.
        last_disconnected_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: Shows the time the device was last disconnected.
        networks:
          $ref: "#/components/schemas/NetworkConfig"
        firmware_version:
          type: string
          description: Shows the device firmware version.
          example: 1.0.0
        last_firmware_update_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: Shows the time the firmware was last updated.
        anti_virus_pattern_version:
          type: string
          description: Shows the anti-virus pattern version of the device.
          example: 20.367.00
        last_pattern_update_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: Shows the time the device was last updated with the anti-virus pattern.
        timezone:
          type: string
          description: Shows the device timezone.
          example: Asia/Taipei
    Policy:
      type: object
      description: Shows information about the group policy.
      required:
        - last_policy_modified_source
        - last_policy_modified_time
        - last_policy
      properties:
        last_policy_modified_source:
          type: string
          enum:
            - Unknown
            - Local Change
            - Group Policy Sync
          description: |
            Shows the source of the last policy modification. Possible values:
              - Unknown
              - Local Change
              - Group Policy Sync
          example: Group Policy Sync
        last_policy_modified_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: Shows the time the policy was last modified.
        last_policy:
          $ref: "#/components/schemas/AppliedPolicy"
    DeviceCommand:
      type: object
      description: Shows the device command information.
      required:
        - type
        - status
        - updated_at
      properties:
        type:
          type: string
          enum:
            - REBOOT
            - FIRMWARE_UPDATE
          description: Shows the type of command.
        status:
          type: string
          enum:
            - pending
            - received
            - processing
            - succeeded
            - failed
            - canceled
            - unsupported
          example: succeeded
          description: Shows the status of the command.
        updated_at:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: Shows the time the record was last updated, in RFC 3339 date-time format.
    Sha256:
      type: string
      pattern: "^[0-9a-fA-F]{64}$"
      example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    QnOperationResult:
      type: integer
      enum:
        - 0
        - 1
        - 2
      format: uint8
      description: |
        Specifies the result of the operation:
          0: Succeeded
          1: Canceled
          2: Failed
    QnErrorType:
      type: integer
      enum:
        - 0
        - 1
        - 2
      format: uint8
      description: |
        Specifies where the error comes from:
          0: None
          1: Windows
          2: Safe Port
    QnDiskType:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
      format: int8
      description: |
        Specifies the type of disk:
          0: Unwanted
          1: Normal
          2: Portable Inspector
          3: Portable Inspector Pro
          4: Memory Card
    QnRemovableDiskOfMediaCheck:
      type: object
      required:
        - id
        - type
        - port_id
        - friendly_name
        - serial_number
        - storage_media_infos
      properties:
        id:
          type: string
          example: "09511666E0D55E6CE77CF761A9B614EF"
          description: Shows the serial number of the removable media involved in the media check.
        type:
          $ref: "#/components/schemas/QnDiskType"
          description: |
            Shows the type of disk:
              0: Unwanted
              1: Normal
              2: Portable Inspector
              3: Portable Inspector Pro
              4: Memory Card
        port_id:
          type: integer
          description: Shows the port ID of the removable media involved in the media check.
        friendly_name:
          type: string
          example: "Kingston DataTraveler 3.0 USB Device"
          description: Shows the friendly name of the removable media involved in the media check.
        serial_number:
          type: string
          example: "123456789ABCDEF"
          description: Shows the serial number of the removable media involved in the media check.
        storage_media_infos:
          type: array
          items:
            $ref: "#/components/schemas/QnDiskStorageInfo"
    RemovableDevice:
