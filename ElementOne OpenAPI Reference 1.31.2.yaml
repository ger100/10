                    type: string
                    format: uuid
                    description: The session ID of the media check log
                  example:
                    - "4cd19f33-c759-4f31-b2a3-48237e093edc"
                    - "e6e08e23-44b2-4307-8366-23ed4d78739b"
                  description: |
                    Lists the session IDs of media check tasks, used to filter media check logs.
                    Each value must match exactly, and values are combined using a logical OR condition.
                visitors:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    description: The visitor name
                  description: |
                    Lists the visitor names used to filter media check logs by guest identity.
                    Values are combined using a logical OR condition, and partial matches are accepted in this field.
                  example:
                    - "test user"
                    - "test user 2"
                media_check_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                    description: The ID of the media check log
                  example:
                    - "4cd19f33-c759-4f31-b2a3-48237e093edc"
                    - "e6e08e23-44b2-4307-8366-23ed4d78739b"
                  description: |
                    Lists the task IDs of media check tasks, used to filter media check logs.
                    Each value must match exactly, and values are combined using a logical OR condition.
                removable_media_serial_numbers:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    description: The serial number of the removable media
                  example:
                    - "09511666E0D55E6CE77CF761A9B614EF"
                    - "09511263E0D55E6CE87CF771A9B414EF"
                  description: |
                    Lists the serial numbers of removable media used to filter the media check logs.
                    Each value must match exactly, and values are combined using a logical OR condition.
                storage_media_type:
                  $ref: "#/components/schemas/QnStorageMediaType"
                  description: |
                    Specifies the type of storage media:
                      0: Unspecified
                      1: Disk
                      2: CD-ROM
                  example: 0
                media_status:
                  $ref: "#/components/schemas/QnMediaStatus"
                  description: |
                    Specifies the status of the media:
                      0: Unspecified
                      1: All partitions scanned
                      2: Unsupported partition found
                      3: Unpartitioned
                      4: Unsupported
                media_check_time_start:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the start date and time (inclusive) for filtering a media check operation by its start time.
                    The filter includes an operation that started at or after the specified value.
                    The value must be in RFC 3339 format.
                media_check_time_end:
                  type: string
                  format: date-time
                  example: "2022-08-25T10:20:50Z"
                  description: |
                    Specifies the end date and time (exclusive) for filtering a media check operation by its start time.
                    The filter includes an operation that started before the specified value but excludes one that started exactly at the end time.
                    The value must be in RFC 3339 format.
      responses:
