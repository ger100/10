                    Specifies the result of the erase operation:
                      0: Succeeded
                      1: Canceled
                      2: Failed
                quick_mode:
                  type: boolean
                  description: |
                    Specifies whether the erase operation uses quick mode.
                error_type:
                  $ref: "#/components/schemas/QnErrorType"
                  description: |
