          example: 4cd19f33-c759-4f31-b2a3-48237e093edc
        name:
          type: string
          description: Shows the Portable Inspector group name.
          example: Group 1
        path:
          type: string
          description: Shows the group’s location in the hierarchy as a full path, where group names are separated by slashes (/).
          example: Global Group/Group 1
        admins:
          type: array
          items:
            type: string
          example:
            - user-12345
            - user-67890
          description: Shows the IDs of admin users who manage the group.
        viewers:
          type: array
          items:
            type: string
          example:
            - user-54321
            - user-09876
          description: Shows the IDs of viewer users who have access to the group.
