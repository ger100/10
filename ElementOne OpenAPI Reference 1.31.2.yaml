    post:
      tags:
        - SCIM
      summary: Create User
      description: "Creates a new SCIM user account with the specified authentication source.\n\n**Required Fields:**\n- `schemas`: SCIM schema URIs\n- `userName`: Unique login identifier\n- `displayName`: User display name  \n- `roles`: Exactly ONE role (array with single element)\n- `urn:elementone:params:scim:schemas:extension:2.0:User`:\n  - `type`: Authentication source (1=Local, 2=SAML)\n  - `description`: User description (string, optional)\n\n**Password Requirements:**\n- Local users (type=1): `password` field is REQUIRED\n- SAML users (type=2): `password` field is NOT ALLOWED\n\n**Username Format Requirements:**\n- Local users (type=1): Alphanumeric and underscore only (1-64 chars)\n- SAML users (type=2): Must be valid email address format\n\n***Note:*** SAML users typically use email as userName for IdP integration.\n"
      operationId: createScimUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUserCreate"
            examples:
              localUser:
                summary: Create Local User
                value:
                  schemas:
                    - "urn:ietf:params:scim:schemas:core:2.0:User"
                    - "urn:elementone:params:scim:schemas:extension:2.0:User"
                  userName: "john.doe"
                  password: "Password123!"
                  displayName: "John Doe"
                  roles: [{value: "roles/viewer"}]
                  urn:elementone:params:scim:schemas:extension:2.0:User: {type: 1, description: "Local user New team member"}
              samlUser:
                summary: Create SAML User
                value:
                  schemas:
                    - "urn:ietf:params:scim:schemas:core:2.0:User"
                    - "urn:elementone:params:scim:schemas:extension:2.0:User"
                  userName: "jane.smith@example.com"
                  displayName: "Jane Smith"
                  roles: [{value: "roles/admin"}]
                  urn:elementone:params:scim:schemas:extension:2.0:User: {type: 2, description: "SAML user from IdP"}
      responses:
        "201":
          description: User created successfully
          headers:
            Location:
              description: URL of the created user
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
              example:
                schemas:
                  - "urn:ietf:params:scim:schemas:core:2.0:User"
                  - "urn:elementone:params:scim:schemas:extension:2.0:User"
                id: "2"
                userName: "john.doe"
                displayName: "John Doe"
                roles: [{value: "roles/viewer"}]
                urn:elementone:params:scim:schemas:extension:2.0:User: {type: 1, description: "New team member"}
                meta:
                  resourceType: "User"
                  created: "2023-01-15T10:30:00Z"
                  lastModified: "2023-01-15T10:30:00Z"
                  location: "https://elementone/openapi/e1/v1/scim/Users/2"
                  # Note: elementone will be replaced with your configured FQDN
        "400":
          $ref: "#/components/responses/SCIMValidationErrorForCreate"
        "401":
          description: Unauthenticated
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "401"
                detail: "Unable to pass authentication"
        "409":
          description: Conflict (userName already exists)
          content:
