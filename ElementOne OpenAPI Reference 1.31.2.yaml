            $ref: "#/components/schemas/SafePortID"
        invalid_dev_ids:
          type: array
          description: Shows the invalid device IDs of Safe Port devices.
          items:
            $ref: "#/components/schemas/SafePortID"
    E1AuditID:
      type: integer
      format: uint16
      minimum: 10000
      maximum: 19999
      example: 10001
      description: |
        Shows the unique identifier of an ElementOne audit.
        Audit IDs are in the range of 10000 to 19999.
    E1AuditResult:
      type: integer
      enum:
        - 1
        - 2
      format: int8
      example: 1
      description: Indicates whether the audit was successful (1) or failed (2).
    E1AuditSeverity:
      type: integer
      enum:
        - 0
        - 10
        - 20
        - 30
        - 40
        - 50
      format: uint8
      example: 10
      description: |
        Indicates the severity level of the audit: \
          0: Unknown \
          10: Debug \
          20: Info \
          30: Warning \
          40: Error \
          50: Critical
    E1AuditSourceType:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
      format: int8
      example: 1
      description: |
        Indicates the source of the audit: \
          0: Unknown \
          1: System \
          2: User \
          3: OpenAPI
    E1AuditLogFilter:
      type: object
      properties:
        log_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
            description: The ID of the audit log
          uniqueItems: true
          description: |
            Lists the log IDs used to filter audit logs.
            Each value must match exactly, and values are combined using a logical OR condition.
        audit_ids:
          type: array
          items:
            $ref: "#/components/schemas/E1AuditID"
          uniqueItems: true
          example:
            - 10001
            - 10002
          description: |
            Lists the audit IDs used to filter audit logs.
            Each value must match exactly, and values are combined using a logical OR condition.
        usernames:
          type: array
          items:
            type: string
          uniqueItems: true
          example:
            - "admin"
            - "user1"
          description: |
            Lists the usernames of the users who performed the audits, used to filter audit logs by user.
            Each value must match exactly, and values are combined using a logical OR condition.
        result:
          $ref: "#/components/schemas/E1AuditResult"
        description:
          type: string
          example: "login"
          description: |
            Specifies a keyword to filter audit logs by description.
            The filter ignores letter case and matches descriptions that include the keyword, even as part of a longer word or phrase.
        from_ips:
          type: array
          items:
            type: string
          uniqueItems: true
          example:
            - "192.168.1.1"
          description: |
            Lists the IP addresses that started the audits, used to filter audit logs by source IP.
            Each value must match exactly, and values are combined using a logical OR condition.
        severity:
          type: array
          items:
            $ref: "#/components/schemas/E1AuditSeverity"
          uniqueItems: true
          description: |
            Lists the severity levels, used to filter audit logs.
            Each value must match exactly, and values are combined using a logical OR condition.
        source:
          $ref: "#/components/schemas/E1AuditSourceType"
        start_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: |
            Specifies the start date and time (inclusive) for filtering audits by their start time.
            Audits that begin at or after the specified time are included.
            The value must be in RFC 3339 format.
        end_time:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50Z"
          description: |
            Specifies the end date and time (exclusive) for filtering audits by their start time.
            Audits that begin before the specified time are included, but those that begin exactly at the end time are excluded.
    E1AuditLog:
      type: object
      required:
        - id
        - audit_id
        - result
        - severity
        - source
        - description
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          example: 1234567
          description: Shows the unique ID of the ElementOne audit log.
        audit_id:
          $ref: "#/components/schemas/E1AuditID"
        result:
          $ref: "#/components/schemas/E1AuditResult"
        severity:
          $ref: "#/components/schemas/E1AuditSeverity"
        source:
          $ref: "#/components/schemas/E1AuditSourceType"
        action_by:
          type: string
          description: Shows the account name of the user who triggered the audit.
        account_type:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: |
            Shows the account type of the user who triggered the audit. \
              0: Unknown \
              1: Local Account \
              2: SAML Account
        from_ip:
          type: string
          description: Shows the IP address that triggered the audit.
        description:
          type: string
          description: Shows a detailed description of the ElementOne audit, including its purpose or context.
        created_at:
          type: string
          format: date-time
          example: "2022-08-25T10:20:50+08:00"
          description: Shows the time the ElementOne audit log was created.
    GetE1AuditLogResponse:
      type: object
      required:
        - items
        - next_page_token
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/E1AuditLog"
        next_page_token:
          $ref: "#/components/schemas/PageToken"
    DataCountInfo:
