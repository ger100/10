          type: array
          items:
            $ref: "#/components/schemas/QnRemovableDiskOfMediaCheck"
          description: Shows the status of the removable media before the operation.
        after:
          type: array
          items:
            $ref: "#/components/schemas/QnRemovableDiskOfMediaCheck"
          description: Shows the status of the removable media after the operation.
      description: Shows the removable media involved in the operation.
    EraseDeviceLog:
